# The checks CI runs, written out (private-workflow subset, same as the
# sibling ash_* repos). No database: the fixtures are ETS-backed and the
# bundle is committed, so both jobs are pure mix.

name: Elixir CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: mix test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - run: mix deps.get
      - run: mix test

  compile:
    name: MIX_ENV=test mix compile --warnings-as-errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - run: mix deps.get
      - run: mix compile --force --warnings-as-errors
